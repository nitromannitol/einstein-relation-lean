version: "v0.4"

project:
  name: "Uniform small-force expansion for reversible diffusions in a random environment"
  description: >-
    A Lean 4 formalization of the paper "Uniform small-force expansion for reversible diffusions in
    a random environment" by Bou-Rabee and Xu: the uniform expansion of the velocity of a reversible
    diffusion in a stationary, finite-range, uniformly elliptic and smooth random environment in the
    applied force, through the critical order d + 1 (Theorem 1.1), the quantitative Einstein relation
    (Theorem 1.2), its optimality (Proposition 7.1), and all the intermediate numbered results. Every
    theorem holds for every environment law satisfying Assumptions 1.1 and 1.2. The proofs use
    thirteen results from the literature, stated in Lean as named axioms with their sources.
    Theorems 1.1 and 1.2 and Proposition 7.1 are independently checked by the comparator pairs under
    EinsteinFullAudit/.
  authors:
    - "Ahmed Bou-Rabee"
    - "Ruizhe Xu"
  responsible_maintainers:
    - "Ahmed Bou-Rabee"
    - "Ruizhe Xu"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.AP"]
  msc2020: ["60K37", "60J60", "35B27"]

