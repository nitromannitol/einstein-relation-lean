version: "v0.4"

project:
  name: "Quantitative Einstein relation for reversible diffusions in a random environment"
  description: >-
    A Lean 4 formalization of the paper "Quantitative Einstein relation for reversible diffusions in
    a random environment" by Bou-Rabee and Xu: the uniform expansion of the velocity of a reversible
    diffusion in a stationary, finite-range, uniformly elliptic and smooth random environment in the
    applied force, through the critical order d + 1 (Theorem 1.1), the quantitative Einstein relation
    (Theorem 1.2), its optimality (Proposition 7.1), and all the intermediate numbered results. Every
    theorem holds for every environment law satisfying Assumptions 1.1 and 1.2. The proofs use
    ten results from the literature, stated in Lean as named axioms with their sources; the
    invariance principle of De Masi, Ferrari, Goldstein and Wick (Theorem 2.2) and Lemma 5.8 of
    Gantert, Mathieu and Piatnitski are proved.
    Theorems 1.1 and 1.2 and Proposition 7.1 are independently checked by the comparator pairs under
    EinsteinFullAudit/.
  authors:
    - "Ahmed Bou-Rabee"
    - "Ruizhe Xu"
  responsible_maintainers:
    - "Ahmed Bou-Rabee"
    - "Ruizhe Xu"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.AP"]
  msc2020: ["60K37", "60J60", "35B27"]

sources:
  - title: "Quantitative Einstein relation for reversible diffusions in a random environment"
    authors:
      - "Ahmed Bou-Rabee"
      - "Ruizhe Xu"
    type: "paper"
    relationship: "formalizes"
    location: "paper/"
    note: "arXiv:2605.26082. Its source, bibliography, figure and compiled PDF are included under paper/."
    license: "authors' copyright; publication licence not yet chosen"
    author_endorsement: "participated"
  - title: "Quantitative Stochastic Homogenization and Large-Scale Regularity"
    authors: ["Scott Armstrong", "Tuomo Kuusi", "Jean-Christophe Mourrat"]
    type: "book"
    relationship: "assumes"
    note: >-
      Grundlehren 352, Springer, 2019. Eight of its results are literature inputs (see README);
      Proposition 5.14 (existence of scalar white noise) is proved.
  - title: "Einstein relation for reversible diffusions in a random environment"
    authors: ["Nina Gantert", "Pierre Mathieu", "Andrey Piatnitski"]
    type: "paper"
    relationship: "assumes"
    note: >-
      Comm. Pure Appl. Math. 65 (2012), 187-228. The law of large numbers (Section 2.3 and
      Proposition 5.9) is a literature input. Lemma 5.8, the no-return bound (5.20) and the
      exponential tail (5.22) of the first regeneration time, is proved:
      EinsteinFull.External.gantert_regeneration_tail_holds in
      EinsteinFull/Regeneration/GantertRegenerationTailProof.lean has the statement of
      EinsteinFull.External.gantert_regeneration_tail and replaces it in the proofs of the numbered
      results. The proof departs from the source in two places: the representation (4.3)-(4.4) of
      the slab-exit probability by a boundary-value problem, used in the proof of Lemma 4.3, is
      proved (Dynkin's formula at the exit time, the limit of zero-boundary resolvents, continuity
      of the exit payoff inside the slab and at its boundary), and the exponential moment (5.26),
      obtained in the source from the argument of Shen (2003), Theorem 4.9, is proved with constants
      uniform in the environment law and the force (see README).
  - title: "An invariance principle for reversible Markov processes"
    authors: ["Anna De Masi", "Pablo A. Ferrari", "Sheldon Goldstein", "W. David Wick"]
    type: "paper"
    relationship: "formalizes"
    note: >-
      J. Stat. Phys. 55 (1989), 787-855. Theorem 2.2 with Remarks 1 and 3, on the space of
      continuous trajectories, is proved: EinsteinFull.External.dfgw_invariance is a theorem, proved
      by EinsteinFull.External.DFGW.dfgw_invariance_holds in
      EinsteinFull/External/DFGW/DFGWInvarianceProof.lean. The proof departs from the source in the
      proof of tightness: instead of the source's argument in the Skorokhod space, tightness is
      proved in the space of continuous paths by a block criterion, and the maximal inequality of
      Lemma 2.6 is used only for the resolvent boundary term of the martingale approximation (see
      README).
  - title: "Diffusions and Elliptic Operators"
    authors: ["Richard F. Bass"]
    type: "book"
    relationship: "assumes"
    note: "Springer, 1997. Chapter VI, Theorem 4.3 (well-posedness of the martingale problem) is a literature input."

