name: First version CI

permissions:
  contents: read

# Builds the first version of the formalization, the self-contained Lake project in
# `first-version/` (its own `lean-toolchain`, `lakefile.lean` and `lake-manifest.json`),
# independently of the project at the repository root.
# Runs on GitHub-hosted runners (`ubuntu-24.04`: 4 vCPU, 16 GB RAM, 6 h per job).
# No `pull_request` trigger: a fork's pull request would run with this repository's
# Actions cache in scope, and the cached `.lake` trees are the artifacts that the
# comparator workflow trusts.
on:
  push:
    branches: [main, add-first-version]
    paths:
      - 'first-version/**'
      - '!first-version/**/*.md'
      - '!first-version/paper/**'
      - '!first-version/formalization.yaml'
      - '!first-version/CITATION.cff'
      - '.github/workflows/first-version.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: first-version

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — the source dependency.
  #
  # Mathlib ships prebuilt oleans (`lake exe cache get`); DeGiorgi does not, so it
  # is compiled here once per (`lean-toolchain`, `lake-manifest.json`) pair and
  # cached.  Splitting it off gives the dependency build and the project build a
  # six-hour budget each.
  # ---------------------------------------------------------------------------
  deps:
    name: Dependency oleans
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      # Installs the toolchain named in `lean-toolchain`, materialises every
      # package in `lake-manifest.json` and downloads the Mathlib oleans.
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          lake-package-directory: first-version

      - name: Restore the dependency build cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: first-version/.lake/packages/DeGiorgi/.lake/build
          key: first-version-lake-deps-${{ hashFiles('first-version/lean-toolchain', 'first-version/lake-manifest.json') }}

      # Always run: on a cache hit this only checks the dependency traces; on a
      # partial restore it finishes the build.
      - name: Build the dependency package
        run: lake build @DeGiorgi

      # Saved only when the build above succeeded and the cache had missed.
      - name: Save the dependency build cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: first-version/.lake/packages/DeGiorgi/.lake/build
          key: first-version-lake-deps-${{ hashFiles('first-version/lean-toolchain', 'first-version/lake-manifest.json') }}

  # ---------------------------------------------------------------------------
  # Job 2 — the library, the source audit and the axiom audit.
  # ---------------------------------------------------------------------------
  build:
    name: Build and axiom audit
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      - name: Source audit (no sorry, admit, axiom, native_decide, implemented_by or debug commands)
        run: python3 scripts/check_sources.py

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          lake-package-directory: first-version

      # Written by the `deps` job of this same run.
      - name: Restore the dependency build cache
        uses: actions/cache/restore@v4
        with:
          path: first-version/.lake/packages/DeGiorgi/.lake/build
          key: first-version-lake-deps-${{ hashFiles('first-version/lean-toolchain', 'first-version/lake-manifest.json') }}

      # Restore/save are split so that the save runs even when a later step fails:
      # a failed or interrupted build still banks its completed modules.  The restore
      # key has no sha, so it matches the most recently created entry with the same
      # toolchain and manifest, which makes an ordinary push an incremental build.
      - name: Restore project build artifacts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: first-version/.lake/build
          key: first-version-lake-proj-${{ hashFiles('first-version/lean-toolchain', 'first-version/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            first-version-lake-proj-${{ hashFiles('first-version/lean-toolchain', 'first-version/lake-manifest.json') }}-

      # The library inherits linter warnings (unused variables and similar) from the
      # development; they are counted and printed, while an incomplete proof fails the job.
      - name: Build the library and reject incomplete proofs
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee production-build.log
          echo "Warnings: $(grep -c '^warning:' production-build.log || true)"
          if grep -iE 'declaration uses .sorry|sorryAx' production-build.log; then
            echo "The library build must not contain incomplete proofs."
            exit 1
          fi

      # The comparator challenges (with their vocabulary) and solutions must elaborate; the
      # only incomplete proofs allowed are the final theorems of the two Challenge.lean files.
      - name: Build the comparator challenges and solutions
        shell: bash
        run: |
          set -o pipefail
          lake build EinsteinRelationAudit 2>&1 | tee audit-build.log
          sorry_lines=$(grep -E "declaration uses .sorry" audit-build.log || true)
          echo "$sorry_lines"
          unexpected=$(printf '%s\n' "$sorry_lines" | grep -v '^$' \
            | grep -vE '^warning: EinsteinRelationAudit/(MobilityRate|SharpExample)/Challenge\.lean:' || true)
          count=$(printf '%s\n' "$sorry_lines" | grep -c 'Challenge\.lean' || true)
          if [ -n "$unexpected" ] || [ "$count" -ne 2 ]; then
            echo "Expected exactly one sorry in each of the two challenges and none elsewhere."
            exit 1
          fi

      # The eleven theorems of MainTheorems.lean must depend on exactly the three
      # standard axioms.  The script writes the report request to a temporary file
      # outside the repository.
      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_axioms.py --log axioms-audit.log

      - name: Save project build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: first-version/.lake/build
          key: first-version-lake-proj-${{ hashFiles('first-version/lean-toolchain', 'first-version/lake-manifest.json') }}-${{ github.sha }}
